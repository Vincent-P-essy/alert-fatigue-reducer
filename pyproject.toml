[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alert-fatigue-reducer"
version = "1.0.0"
description = "Reduce SOC alert volume without hiding the real ones: MinHash+LSH clustering, explainable ranking, and a measurement of how many true positives stopped being visible."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vincent Plessy" }]
keywords = ["soc", "alert-fatigue", "deduplication", "minhash", "lsh", "security", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
afr = "afr.cli:main"

[project.urls]
Homepage = "https://github.com/Vincent-P-essy/alert-fatigue-reducer"

[tool.hatch.build.targets.wheel]
packages = ["src/afr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
